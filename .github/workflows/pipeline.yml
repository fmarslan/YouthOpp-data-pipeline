name: Collect and publish catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            adapters
            tests
            data/sources
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate && npm test
      - name: Restore durable previous release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p previous
          if gh api "repos/${GH_REPO}/releases/tags/catalog-latest" > previous/release.json 2> previous/restore-error.txt; then
            gh release download catalog-latest --pattern catalog.json --dir previous
            echo "PREVIOUS_CATALOG=previous/catalog.json" >> "$GITHUB_ENV"
          else
            if rg -q "HTTP 404" previous/restore-error.txt; then
              echo "No prior catalog release. First successful collection seeds state."
            else
              cat previous/restore-error.txt
              exit 1
            fi
          fi
      - run: npm run pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_id }}
          path: dist/
      - name: Publish durable version and latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "catalog-${GITHUB_RUN_ID}" dist/catalog.json dist/collection-report.json --target "$GITHUB_SHA" --title "Catalog ${GITHUB_RUN_ID}" --notes "Open AI agent: automated source collection. See collection-report.json for source health."
          if ! gh release view catalog-latest >/dev/null 2>&1; then
            gh release create catalog-latest --target "$GITHUB_SHA" --title "Latest catalog" --notes "Open AI agent: latest successful catalog."
          fi
          gh release upload catalog-latest dist/catalog.json dist/collection-report.json --clobber
